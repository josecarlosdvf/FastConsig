global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/slo-alerts.yml

scrape_configs:
  - job_name: "fastconsig-api"
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: "change-me-metrics-token"
    static_configs:
      - targets: ["api:3001"]
